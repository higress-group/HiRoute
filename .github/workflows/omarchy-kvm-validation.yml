name: Omarchy x86 hardware acceleration probe

on:
  push:
    branches: [codex/omarchy-kvm-validation]

permissions: {}

jobs:
  probe:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    steps:
      - name: Verify KVM on the x86_64 runner
        shell: bash
        run: |
          test "$(uname -m)" = x86_64
          sudo /usr/bin/python3 - <<'PY'
          import fcntl
          with open("/dev/kvm", "rb+") as kvm:
              version = fcntl.ioctl(kvm, 0xAE00, 0)
          print(f"KVM API version {version}")
          assert version == 12
          PY
