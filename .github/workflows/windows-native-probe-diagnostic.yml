name: windows-native-local-probe-diagnostic
on:
  push:
    branches: [codex/release-0.5.0-claude-auth]
permissions:
  contents: read
  actions: read
jobs:
  tool-free-claude:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Locked native client
        shell: pwsh
        run: |
          npm --prefix tools/windows-agent-fixtures ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Pinned client installation failed' }
          $clients = @(Get-ChildItem tools/windows-agent-fixtures/node_modules/@anthropic-ai/claude-code-win32-x64 -Recurse -Filter claude.exe)
          if ($clients.Count -ne 1) { throw 'One pinned native client required' }
          "HIROUTE_WORKER_CLAUDE_BINARY=$($clients[0].FullName)" >> $env:GITHUB_ENV
      - name: Actual installed daemon and pinned independent model fixtures
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 41530295529 --repo higress-group/HiRoute --name release-x86_64-pc-windows-msvc-desktop-4be499ff7bb067e6d39a015103971f6af5584f70-1 --dir artifacts/frozen-installer
          if ($LASTEXITCODE -ne 0) { throw 'Frozen installer artifact download failed' }
          $prepare = @'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          sha='4be499ff7bb067e6d39a015103971f6af5584f70'
          bundles=list(Path('artifacts/frozen-installer').rglob('development-bundle.zip'))
          assert len(bundles)==1
          destination=Path('artifacts/frozen-product/bin').resolve()
          destination.mkdir(parents=True,exist_ok=False)
          with zipfile.ZipFile(bundles[0]) as source:
              manifest=json.loads(source.read('manifest.json'))
              assert manifest['source_revision']==sha and manifest['target']=='x86_64-pc-windows-msvc'
              assert manifest['installer_format']=='nsis'
              for name in ('hiroute.exe','hirouted.exe'):
                  raw=source.read(name);record=manifest['files'][name]
                  assert len(raw)==record['bytes'] and hashlib.sha256(raw).hexdigest()==record['sha256']
                  with (destination/name).open('xb') as output: output.write(raw)
          identity=json.loads(subprocess.check_output([str(destination/'hiroute.exe'),'version','--output','json'],text=True))['data']
          assert identity['source_revision']==sha and identity['version']=='0.5.0'
          print(json.dumps({'frozen_package_cli_identity':identity,'files':{name:manifest['files'][name] for name in ('hiroute.exe','hirouted.exe')}}))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              output.write('HIROUTE_VALIDATION_PRODUCT_BIN_DIR='+str(destination)+'\n')
          '@
          $prepare | Set-Content "$env:RUNNER_TEMP/frozen-product.py" -Encoding utf8
          python "$env:RUNNER_TEMP/frozen-product.py"
          if ($LASTEXITCODE -ne 0) { throw 'Frozen packaged product verification failed' }
          New-Item -ItemType Directory -Force artifacts/probe-diagnostic | Out-Null
          python scripts/windows-agent-fixtures.py --daemon artifacts/frozen-product/bin/hirouted.exe --output artifacts/probe-diagnostic/clients > artifacts/probe-diagnostic/clients.json
          if ($LASTEXITCODE -ne 0) { throw 'Pinned independent client fixture failed' }
          $clients = Get-Content artifacts/probe-diagnostic/clients.json -Raw | ConvertFrom-Json
          foreach ($property in $clients.environment.PSObject.Properties) {
            "$($property.Name)=$($property.Value)" >> $env:GITHUB_ENV
          }
          foreach ($entry in $clients.discovery_path) { $entry >> $env:GITHUB_PATH }
      - name: Actual installed public business with closed native failure classification
        shell: pwsh
        run: |
          cargo test --locked -p hiroute-daemon --test windows_headless actual_windows_complete_public_headless_business -- --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Installed public business diagnostic failed' }
