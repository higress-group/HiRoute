name: build-release-platform

on:
  workflow_dispatch:
    inputs:
      target:
        description: Native installer candidate target
        type: choice
        default: x86_64-pc-windows-msvc
        options: [x86_64-pc-windows-msvc]
      runner:
        description: Native build host
        type: choice
        default: windows-2025
        options: [windows-2025]
      windows_desktop:
        description: Build the NSIS installer for native acceptance
        type: boolean
        default: true
      component_probe:
        description: Run only temporary Windows shell component diagnostics; no installer
        type: boolean
        default: false
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      runner:
        required: true
        type: string
      windows_desktop:
        default: false
        type: boolean
      component_probe:
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Linux container host
        if: runner.os == 'Linux'
        run: docker version
      - name: Mac build prerequisites
        if: runner.os == 'macOS'
        run: command -v cmake >/dev/null || brew install cmake
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Prepare pinned CPA source
        if: runner.os != 'Windows'
        run: |
          repository=$(python3 -c 'import json; print(json.load(open("vendor/cpa/source.json"))["repository"])')
          revision=$(python3 -c 'import json; print(json.load(open("vendor/cpa/source.json"))["commit"])')
          git init "$RUNNER_TEMP/cpa"
          git -C "$RUNNER_TEMP/cpa" fetch --depth=1 "$repository" "$revision"
          git -C "$RUNNER_TEMP/cpa" checkout --detach FETCH_HEAD
      - name: Prepare pinned CPA source on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pin = Get-Content vendor/cpa/source.json -Raw | ConvertFrom-Json
          git init "$env:RUNNER_TEMP/cpa"
          git -C "$env:RUNNER_TEMP/cpa" fetch --depth=1 $pin.repository $pin.commit
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPA fetch failed' }
          git -C "$env:RUNNER_TEMP/cpa" checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Pinned CPA checkout failed' }
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/cpa/go.mod
          cache: false
      - name: Repository Rust toolchain
        shell: bash
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: rustup show active-toolchain && rustup target add "$RELEASE_TARGET"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-sources-${{ inputs.target }}-${{ hashFiles('Cargo.lock') }}
      - name: Build and verify the exact candidate
        if: runner.os != 'Windows'
        env:
          RELEASE_TARGET: ${{ inputs.target }}
        run: |
          python3 scripts/ci-run.py --name release-candidate --expected-sha "$GITHUB_SHA" \
            --timeout 6600 --plan release-platforms --phase final -- \
            python3 scripts/build-release.py --target "$RELEASE_TARGET" \
            --cpa-source-repo "$RUNNER_TEMP/cpa"
      - name: Build and verify the exact Windows candidate
        if: runner.os == 'Windows' && !inputs.component_probe
        shell: pwsh
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          WINDOWS_DESKTOP: ${{ inputs.windows_desktop }}
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact dispatch SHA required' }
          $desktop = @()
          if ($env:WINDOWS_DESKTOP -eq 'true') { $desktop = @('--windows-desktop') }
          $buildOutput = python scripts/build-release.py --target $env:RELEASE_TARGET --cpa-source-repo "$env:RUNNER_TEMP/cpa" @desktop
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows candidate build failed' }
          $buildOutput
          if ($desktop.Count -gt 0) {
            New-Item artifacts/windows-desktop -ItemType Directory -Force | Out-Null
            $buildOutput | Set-Content artifacts/windows-desktop/build-result.json -Encoding utf8
            $env:HIROUTE_BUILD_SOURCE_SHA = $env:GITHUB_SHA
            $env:CARGO_ENCODED_RUSTFLAGS = '-C' + [char]31 + 'target-feature=+crt-static'
            $env:CMAKE_TOOLCHAIN_FILE = (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-release-toolchain.cmake').Replace('\', '/')
            cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib -- --nocapture 2>&1 | Tee-Object artifacts/windows-desktop/shell-test.log
            if ($LASTEXITCODE -ne 0) { throw 'Native shell regressions failed' }
            cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib runtime::installer::embedded_cli_failure_keeps_native_detail -- --ignored --exact --nocapture 2>&1 | Tee-Object artifacts/windows-desktop/installer-diagnostic-test.log
            if ($LASTEXITCODE -ne 0 -or -not (Select-String -Quiet -SimpleMatch 'Windows error: 32' artifacts/windows-desktop/installer-diagnostic-test.log)) { throw 'Native installer diagnostic regression failed' }
            cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-cli --lib service::restore_plan::tests -- --nocapture 2>&1 | Tee-Object artifacts/windows-desktop/agent-restore-plan-test.log
            if ($LASTEXITCODE -ne 0) { throw 'Native uninstall restore-plan regressions failed' }
            cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib --no-run --message-format=json | Tee-Object artifacts/windows-desktop/compiler.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Native shell regression export failed' }
            cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-daemon --test windows_desktop --no-run --message-format=json | Tee-Object -Append artifacts/windows-desktop/compiler.jsonl
            if ($LASTEXITCODE -ne 0) { throw 'Native installer acceptance harness compilation failed' }
            python scripts/windows-dev.py bundle-desktop --result artifacts/windows-desktop/build-result.json --log artifacts/windows-desktop/compiler.jsonl --output artifacts/windows-desktop/development-bundle.zip
            if ($LASTEXITCODE -ne 0) { throw 'Native installer development bundle verification failed' }
          }
      - name: Diagnose temporary Windows shell components
        if: runner.os == 'Windows' && inputs.component_probe
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne $env:GITHUB_SHA) { throw 'Exact dispatch SHA required' }
          New-Item artifacts/windows-shell-components -ItemType Directory -Force | Out-Null
          $env:HIROUTE_BUILD_SOURCE_SHA = $env:GITHUB_SHA
          $env:CARGO_ENCODED_RUSTFLAGS = '-C' + [char]31 + 'target-feature=+crt-static'
          $env:CMAKE_TOOLCHAIN_FILE = (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows-release-toolchain.cmake').Replace('\', '/')
          npm.cmd ci --prefix apps/shell
          if ($LASTEXITCODE -ne 0) { throw 'Shell build prerequisites failed' }
          npm.cmd run build --prefix apps/shell
          if ($LASTEXITCODE -ne 0) { throw 'Shell frontend build failed' }
          cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib runtime::updater::staging::tests -- --nocapture --test-threads=1 2>&1 | Tee-Object artifacts/windows-shell-components/tests.log
          $testExit = $LASTEXITCODE
          cargo test --locked --release --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib --no-run --message-format=json | Tee-Object artifacts/windows-shell-components/compiler.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Component executable export failed' }
          $executables = @(Get-Content artifacts/windows-shell-components/compiler.jsonl | ForEach-Object {
            $record = $_ | ConvertFrom-Json
            if ($record.reason -eq 'compiler-artifact' -and $record.target.name -eq 'hiroute_shell' -and $record.profile.test -and $record.executable) { $record.executable }
          })
          if ($executables.Count -ne 1) { throw 'Exactly one native component executable required' }
          Copy-Item $executables[0] artifacts/windows-shell-components/hiroute_shell.exe
          @{component_probe=$true;source_revision=$env:GITHUB_SHA;target='x86_64-pc-windows-msvc';test_exit=$testExit;sha256=(Get-FileHash artifacts/windows-shell-components/hiroute_shell.exe -Algorithm SHA256).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content artifacts/windows-shell-components/result.json -Encoding utf8
          if ($testExit -ne 0 -or -not (Select-String -Quiet -Pattern 'test result: ok\. [1-9][0-9]* passed; 0 failed' artifacts/windows-shell-components/tests.log)) { throw 'Native component diagnostics failed' }
      - uses: actions/upload-artifact@v4
        if: always() && inputs.component_probe
        with:
          name: windows-shell-components-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/windows-shell-components
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always() && !inputs.component_probe
        with:
          name: release-${{ inputs.target }}${{ inputs.windows_desktop && '-desktop' || '' }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            target/release-candidate/**/assets/*
            target/release-candidate/**/internal-payloads/*
            target/release-candidate/**/result.json
            target/release-candidate/**/build.log
            target/release-candidate/**/linux-abi.json
            target/release-candidate/**/runtime/*.log
            target/release-candidate/**/runtime/diagnostics/**/*.jsonl
            target/release-candidate/**/*.provenance.json
            target/desktop-package/**/result.json
            target/desktop-package/**/build.log
            artifacts/ci
            artifacts/windows-desktop
          if-no-files-found: error
          retention-days: 14
