name: windows-headless-compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'assets/**'
      - 'vendor/**'
      - 'tools/**'
      - 'apps/shell/**'
      - 'scripts/**'
      - '.github/workflows/windows-compile.yml'

permissions:
  contents: read

concurrency:
  group: windows-compile-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Repository Rust toolchain
        shell: pwsh
        run: rustup show active-toolchain
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-check-sources-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-check-sources-${{ runner.arch }}-
      - name: Check headless binaries and their test targets
        shell: pwsh
        run: |
          cargo check --locked --target x86_64-pc-windows-msvc -p hiroute-cli -p hiroute-daemon -p hiroute-platform -p hiroute-local-storage -p hiroute-integrations --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows headless compilation failed' }
      - name: Test Windows package and restore policy components
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          $admin = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          @{ version=$os.Version; build=$os.BuildNumber; architecture=[Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString(); administrator=$admin; evidence='component fixtures, not standard-user installation acceptance' } | ConvertTo-Json -Compress
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-host-runtime --lib standalone_install::
          if ($LASTEXITCODE -ne 0) { throw 'Windows installation component regressions failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-host-runtime --lib storage_recovery::
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup-attempt recovery regressions failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-platform --lib windows::shell_registration::tests::inherited_export_is_published_privately_and_changed_material_is_not_overwritten -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Windows recovery-material publication regression failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-platform --lib private_fs::tests::storage_preparation_reopens_without_adopting_a_file -- --exact
          if ($LASTEXITCODE -ne 0) { throw 'Windows storage directory classification regression failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-local-storage --lib migrations::startup_recovery::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows startup recovery regressions failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-local-storage --lib control::capability_registration::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows grant admission component regressions failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-cli --lib service::recovery_text_tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Windows recovery source path regression failed' }
      - name: Check Windows console shell and its restricted host commands
        shell: pwsh
        env:
          # Compile the host without release payloads; build-release.py stages
          # and validates those before packaging with the production config.
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          npm ci --prefix apps/shell
          if ($LASTEXITCODE -ne 0) { throw 'Shell frontend dependencies failed' }
          npm run build --prefix apps/shell
          if ($LASTEXITCODE -ne 0) { throw 'Shell frontend build failed' }
          cargo check --locked --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --all-targets
          if ($LASTEXITCODE -ne 0) { throw 'Windows console shell compilation failed' }
          cargo test --locked --target x86_64-pc-windows-msvc -p hiroute-shell --features shell-runtime --lib
          if ($LASTEXITCODE -ne 0) { throw 'Windows current-installation and startup-guidance regressions failed' }
