name: publish-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hiroute-ai-production
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  verify-release:
    # Experiment evidence Releases contain data, not product distributions.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: macos-15
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      website_revision: ${{ steps.release.outputs.website_revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve published release contract
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || { echo 'Invalid release tag' >&2; exit 1; }
          revision=$(git rev-parse "$RELEASE_TAG^{commit}")
          website_revision=$(git rev-parse HEAD)
          release_state=$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)
          [[ $(jq -r .isDraft <<<"$release_state") == false ]] || { echo 'Release is still a draft' >&2; exit 1; }
          prerelease=$(jq -r .isPrerelease <<<"$release_state")
          channel=stable; [[ "$prerelease" == true ]] && channel=preview
          node apps/website/scripts/release-manifest.mjs validate apps/website/data/releases.json --tag "$RELEASE_TAG" --revision "$revision" --channel "$channel"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "website_revision=$website_revision" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/release-assets"
          node apps/website/scripts/release-manifest.mjs artifacts apps/website/data/releases.json --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-assets.tsv"
          while IFS=$'\t' read -r filename _; do
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets" --pattern "$filename"
          done < "$RUNNER_TEMP/release-assets.tsv"
      - name: Verify checksums and packaged contents
        env:
          RELEASE_REVISION: ${{ steps.release.outputs.revision }}
        run: |
          node apps/website/scripts/release-manifest.mjs verify-assets apps/website/data/releases.json --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --asset-dir "$RUNNER_TEMP/release-assets"
          node apps/website/scripts/release-manifest.mjs desktop-artifacts apps/website/data/releases.json --tag "$RELEASE_TAG" > "$RUNNER_TEMP/desktop-assets.txt"
          while IFS= read -r filename; do
            identity="$RUNNER_TEMP/release-assets/$filename.identity.json"
            python3 scripts/package-desktop.py verify-dmg "$RUNNER_TEMP/release-assets/$filename" > "$identity"
            node apps/website/scripts/release-manifest.mjs verify-desktop-identity apps/website/data/releases.json --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --filename "$filename" --identity "$identity"
          done < "$RUNNER_TEMP/desktop-assets.txt"
          node apps/website/scripts/release-manifest.mjs standalone-packages apps/website/data/releases.json --tag "$RELEASE_TAG" > "$RUNNER_TEMP/standalone-assets.tsv"
          while IFS=$'\t' read -r manifest archive; do
            python3 scripts/package-standalone.py verify "$RUNNER_TEMP/release-assets/$manifest" "$RUNNER_TEMP/release-assets/$archive"
          done < "$RUNNER_TEMP/standalone-assets.tsv"

  publish:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: website-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.website_revision }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: apps/website
      - name: Download and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.verify-release.outputs.revision }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-assets"
          node apps/website/scripts/release-manifest.mjs artifacts apps/website/data/releases.json --tag "$RELEASE_TAG" > "$RUNNER_TEMP/release-assets.tsv"
          while IFS=$'\t' read -r filename _; do
            gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-assets" --pattern "$filename"
          done < "$RUNNER_TEMP/release-assets.tsv"
          node apps/website/scripts/release-manifest.mjs verify-assets apps/website/data/releases.json --tag "$RELEASE_TAG" --revision "$RELEASE_REVISION" --asset-dir "$RUNNER_TEMP/release-assets"
      - name: Build website from the release manifest
        run: npm test && npm run build
        working-directory: apps/website
      - name: Install Aliyun CLI
        run: .github/scripts/install-aliyun-cli.sh "$RUNNER_TEMP/bin"
      - name: Upload immutable installers, then publish their website links
        env:
          ACCESS_KEYID: ${{ secrets.ACCESS_KEYID }}
          ACCESS_KEYSECRET: ${{ secrets.ACCESS_KEYSECRET }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          .github/scripts/publish-release-oss.sh "$RUNNER_TEMP/release-assets" apps/website/data/releases.json "$RELEASE_TAG"
          .github/scripts/deploy-website-oss.sh apps/website/dist apps/website/data/releases.json

  record-contracts:
    needs: [verify-release, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify-release.outputs.website_revision }}
          fetch-depth: 0
          persist-credentials: false
      - name: Propose the published contract snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_REVISION: ${{ needs.verify-release.outputs.revision }}
          WEBSITE_REVISION: ${{ needs.verify-release.outputs.website_revision }}
        run: bash .github/scripts/release-contract-pr.sh
