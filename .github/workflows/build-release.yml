name: build-release-candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-validation:
    uses: ./.github/workflows/windows-headless.yml

  build-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    uses: ./.github/workflows/build-release-platform.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  # Headless archives are internal test/installer payloads, never public assets.
  build-windows:
    needs: windows-validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
          - target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    uses: ./.github/workflows/build-release-platform.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}

  build-windows-desktop:
    needs: windows-validation
    uses: ./.github/workflows/build-release-platform.yml
    with:
      target: x86_64-pc-windows-msvc
      runner: windows-2025
      windows_desktop: true
