name: website

on:
  pull_request:
    paths:
      - 'apps/website/**'
      - 'assets/model-feed/**'
      - 'assets/model-data/**'
      - 'assets/release-facts/**'
      - 'contracts/releases/**'
      - 'crates/domain/**'
      - 'crates/integrations/**'
      - 'tools/release-facts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/ci-setup/**'
      - 'news/**'
      - 'experiments/**'
      - 'decision-extensions/**'
      - 'scripts/collect-third-party-licenses.py'
      - 'scripts/build-cpa.py'
      - 'scripts/build-release.py'
      - 'scripts/test-build-release.py'
      - '.github/workflows/build-release.yml'
      - 'scripts/install-standalone.py'
      - 'scripts/package-desktop.py'
      - 'scripts/package-standalone.py'
      - 'scripts/test-package-desktop.py'
      - 'scripts/test-build-cpa.py'
      - 'scripts/test-standalone-install.py'
      - 'scripts/test-third-party-licenses.py'
      - '.github/workflows/website.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'assets/model-feed/**'
      - 'assets/model-data/**'
      - 'assets/release-facts/**'
      - 'contracts/releases/**'
      - 'crates/domain/**'
      - 'crates/integrations/**'
      - 'tools/release-facts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/ci-setup/**'
      - 'news/**'
      - 'experiments/**'
      - 'decision-extensions/**'
      - 'scripts/collect-third-party-licenses.py'
      - 'scripts/build-cpa.py'
      - 'scripts/build-release.py'
      - 'scripts/test-build-release.py'
      - '.github/workflows/build-release.yml'
      - 'scripts/install-standalone.py'
      - 'scripts/package-desktop.py'
      - 'scripts/package-standalone.py'
      - 'scripts/test-package-desktop.py'
      - 'scripts/test-build-cpa.py'
      - 'scripts/test-standalone-install.py'
      - 'scripts/test-third-party-licenses.py'
      - '.github/workflows/website.yml'
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('website-pr-{0}', github.event.pull_request.number) || 'hiroute-ai-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/website/package-lock.json
      - uses: ./.github/actions/ci-setup
      - name: Validate model feed with the client admission code
        env:
          MODEL_FEED_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          feed_args=()
          if [[ -n "$MODEL_FEED_BASE" && "$MODEL_FEED_BASE" != "0000000000000000000000000000000000000000" ]]; then feed_args=(--base "$MODEL_FEED_BASE"); fi
          cargo run -p hiroute-release-facts -- feed build --check "${feed_args[@]}"
      - name: Check feed structure
        run: node apps/website/scripts/model-feed.mjs check
      - uses: actions/upload-artifact@v4
        with:
          name: hiroute-model-feed-${{ github.sha }}
          path: assets/model-feed/payload.json
          if-no-files-found: error
          retention-days: 7
      - run: npm ci --ignore-scripts
        working-directory: apps/website
      - name: Verify published experiment evidence
        run: |
          python3 experiments/reproduce.py fetch
          python3 experiments/reproduce.py verify
          python3 -m unittest discover -s experiments/tests
      - run: npm test
        working-directory: apps/website
      - run: npm run build
        working-directory: apps/website
      - name: Test distribution packaging contracts
        run: |
          python3 scripts/test-third-party-licenses.py
          python3 scripts/test-build-cpa.py
          python3 scripts/test-build-release.py
          python3 scripts/test-package-desktop.py
          python3 scripts/test-standalone-install.py
      - uses: actions/upload-artifact@v4
        with:
          name: hiroute-website-${{ github.sha }}
          path: apps/website/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: website-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: hiroute-website-${{ github.sha }}
          path: apps/website/dist
      - uses: actions/download-artifact@v4
        with:
          name: hiroute-model-feed-${{ github.sha }}
          path: ${{ runner.temp }}/validated-model-feed
      - name: Prepare validated model feed before upload
        run: node apps/website/scripts/model-feed.mjs publish --payload "$RUNNER_TEMP/validated-model-feed/payload.json"
      - name: Install Aliyun CLI
        run: .github/scripts/install-aliyun-cli.sh "$RUNNER_TEMP/bin"
      - name: Upload static website to hiroute-ai
        env:
          ACCESS_KEYID: ${{ secrets.ACCESS_KEYID }}
          ACCESS_KEYSECRET: ${{ secrets.ACCESS_KEYSECRET }}
        run: |
          export PATH="$RUNNER_TEMP/bin:$PATH"
          .github/scripts/deploy-website-oss.sh apps/website/dist apps/website/data/releases.json
