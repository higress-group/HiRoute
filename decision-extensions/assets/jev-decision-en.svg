<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">One context. Two perspectives.</title><desc id="desc">One upstream Jev request · Choice and assessment returned together. Assess the previous stage. Choose for the next one.</desc>
