<rect width="1120" height="660" rx="24" fill="#101727"/>
<g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="28" fill="#fff" font-weight="600">One context. Two perspectives.</text><text x="40" y="88" font-size="17" fill="#b4bfd6" font-weight="400">One upstream Jev request · Choice and assessment returned together</text>
<text x="40" y="146" font-size="18" fill="#a8b8ed" font-weight="400">HiRoute supplies</text><text x="792" y="146" font-size="18" fill="#a8b8ed" font-weight="400">HiRoute applies &amp; records</text><rect x="40" y="170" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="204" font-size="21" fill="#fff" font-weight="600">Current input</text><text x="60" y="237" font-size="16" fill="#b4bfd6" font-weight="400">Question, feedback or continuation</text><rect x="40" y="282" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="316" font-size="21" fill="#fff" font-weight="600">Execution history</text><text x="60" y="349" font-size="16" fill="#b4bfd6" font-weight="400">Answers · Tool activity · Branches</text><rect x="40" y="394" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="428" font-size="21" fill="#fff" font-weight="600">Allowed branches</text><text x="60" y="461" font-size="16" fill="#b4bfd6" font-weight="400">Defined by the active routing plan</text><path d="M350 217H380V329M350 441H380V329" fill="none" stroke="#8394cc" stroke-width="2"/><path d="M350 329H415" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="423" y="204" width="290" height="250" rx="15" fill="url(#hub)" stroke="#7582cb"/><text x="449" y="243" font-size="37" fill="#c0c9ff" font-weight="600">Jev</text><text x="449" y="275" font-size="18" fill="#b4bfd6" font-weight="400">Official Jev extension</text><text x="449" y="324" font-size="19" fill="#e9ecfb" font-weight="400">Understand the current task</text><text x="449" y="355" font-size="19" fill="#e9ecfb" font-weight="400">Consider prior performance</text><text x="449" y="416" font-size="18" fill="#c0c9ff" font-weight="400">Choice + optional Score</text><path d="M713 329H753V238H786" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M753 329V404H786" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="792" y="183" width="288" height="113" rx="15" fill="#222d4d" stroke="#7487d5"/><text x="812" y="222" font-size="23" fill="#d0d9ff" font-weight="600">Next branch</text><text x="812" y="260" font-size="17" fill="#b4bfd6" font-weight="400">For the work ahead</text><rect x="792" y="347" width="288" height="113" rx="15" fill="#2b2544" stroke="#8c78b6"/><text x="812" y="386" font-size="19" fill="#e0cef8" font-weight="600">Stage competence · optional</text><text x="812" y="424" font-size="16" fill="#c4b5d9" font-weight="400">Attributed to the previous stage</text><path d="M1080 238H1096V524H24V329H34" fill="none" stroke="#697aab" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="265" y="557" font-size="18" fill="#b4bfd6" font-weight="400">Execution adds evidence for the next decision</text><text x="40" y="617" font-size="17" fill="#9aa8c6" font-weight="400">Assess the previous stage. Choose for the next one.</text></g></svg>
