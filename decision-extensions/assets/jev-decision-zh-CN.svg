<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
<title id="title">同一份证据，两种判断</title><desc id="desc">一次 Jev 上游请求 · 选择与评分同时返回. 评分回看此前阶段，分支选择面向下一阶段。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#9ba9ee" stroke-width="1.5"/></marker><linearGradient id="hub" x2="1" y2="1"><stop stop-color="#303764"/><stop offset="1" stop-color="#222943"/></linearGradient></defs>
<rect width="1120" height="660" rx="24" fill="#101727"/>
<g font-family="Inter,Arial,'PingFang SC','Microsoft YaHei',sans-serif">
<text x="40" y="55" font-size="28" fill="#fff" font-weight="600">同一份证据，两种判断</text><text x="40" y="88" font-size="17" fill="#b4bfd6" font-weight="400">一次 Jev 上游请求 · 选择与评分同时返回</text>
<text x="40" y="146" font-size="18" fill="#a8b8ed" font-weight="400">HiRoute 提供</text><text x="792" y="146" font-size="18" fill="#a8b8ed" font-weight="400">HiRoute 执行与记录</text><rect x="40" y="170" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="204" font-size="21" fill="#fff" font-weight="600">当前输入</text><text x="60" y="237" font-size="16" fill="#b4bfd6" font-weight="400">问题、反馈或继续任务</text><rect x="40" y="282" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="316" font-size="21" fill="#fff" font-weight="600">执行历史</text><text x="60" y="349" font-size="16" fill="#b4bfd6" font-weight="400">回答 · 工具行为 · 分支</text><rect x="40" y="394" width="310" height="94" rx="15" fill="#182135" stroke="#33415d"/><text x="60" y="428" font-size="21" fill="#fff" font-weight="600">允许分支</text><text x="60" y="461" font-size="16" fill="#b4bfd6" font-weight="400">由当前路由计划限定</text><path d="M350 217H380V329M350 441H380V329" fill="none" stroke="#8394cc" stroke-width="2"/><path d="M350 329H415" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="423" y="204" width="290" height="250" rx="15" fill="url(#hub)" stroke="#7582cb"/><text x="449" y="243" font-size="37" fill="#c0c9ff" font-weight="600">Jev</text><text x="449" y="275" font-size="18" fill="#b4bfd6" font-weight="400">官方 Jev 扩展</text><text x="449" y="324" font-size="19" fill="#e9ecfb" font-weight="400">理解当前任务</text><text x="449" y="355" font-size="19" fill="#e9ecfb" font-weight="400">结合此前执行表现</text><text x="449" y="416" font-size="18" fill="#c0c9ff" font-weight="400">Choice + 可选 Score</text><path d="M713 329H753V238H786" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><path d="M753 329V404H786" fill="none" stroke="#9ba9ee" stroke-width="2" marker-end="url(#arrow)"/><rect x="792" y="183" width="288" height="113" rx="15" fill="#222d4d" stroke="#7487d5"/><text x="812" y="222" font-size="23" fill="#d0d9ff" font-weight="600">下一分支</text><text x="812" y="260" font-size="17" fill="#b4bfd6" font-weight="400">用于后续执行</text><rect x="792" y="347" width="288" height="113" rx="15" fill="#2b2544" stroke="#8c78b6"/><text x="812" y="386" font-size="19" fill="#e0cef8" font-weight="600">阶段胜任度 · 可选</text><text x="812" y="424" font-size="16" fill="#c4b5d9" font-weight="400">记录到此前模型阶段</text><path d="M1080 238H1096V524H24V329H34" fill="none" stroke="#697aab" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrow)"/><text x="265" y="557" font-size="18" fill="#b4bfd6" font-weight="400">执行产生新证据，用于后续决策</text><text x="40" y="617" font-size="17" fill="#9aa8c6" font-weight="400">评分回看此前阶段，分支选择面向下一阶段。</text></g></svg>
