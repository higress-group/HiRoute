[workspace]
members = [
    "apps/desktop/src-tauri",
    "apps/shell/src-tauri",
    "crates/application",
    "crates/application-api",
    "crates/cli",
    "crates/client-core",
    "crates/cpa-bridge",
    "crates/daemon",
    "crates/desktop-host-effects",
    "crates/diagnostics",
    "crates/domain",
    "crates/gateway-core",
    "crates/gateway",
    "crates/host-runtime",
    "crates/integrations",
    "crates/local-storage",
    "crates/observation",
    "crates/platform",
    "crates/product-session",
    "crates/platform/test-support",
    "tools/e2e-harness",
    "tools/product-e2e",
    "tools/release-facts",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
aes-gcm = "0.10.3"
arc-swap = "1.7.1"
async-trait = "0.1.89"
base64 = "0.22.1"
bytes = "1.10.1"
clap = { version = "4.5.47", features = ["derive"] }
futures = "0.3.31"
fs2 = "0.4.3"
getrandom = "0.3.3"
h2 = "0.4.18"
hmac = "0.12.1"
http = "1.3.1"
nix = { version = "0.31.3", features = ["fs", "socket", "user"] }
parking_lot = "0.12.4"
semver = "1.0.28"
rusqlite = { version = "0.32.1", features = ["backup", "bundled", "hooks"] }
zstd = "0.13.3"
rustix = { version = "1.1.4", features = ["process"] }
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.143"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.21.0"
thiserror = "2.0.16"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.16"
zeroize = "1.8.1"
unicase = "=2.9.0"
unicode-normalization = "=0.1.25"
unicode-segmentation = "=1.12.0"

[profile.bench]
codegen-units = 1
lto = "thin"

# Smoke and Gateway attestation hash large executables many times in Debug runs.
# Keep application crates and their debug assertions at the normal dev settings.
[profile.dev.package.sha2]
opt-level = 3

# Native Debug acceptance keeps the production observation read deadlines.
# Compile SQLite's C amalgamation with optimization while preserving application
# debug assertions and the normal per-checkout target directory.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
