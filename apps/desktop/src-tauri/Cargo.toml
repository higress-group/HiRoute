[package]
name = "hiroute-desktop"
version = "0.2.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
desktop-runtime = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]
desktop-pilot = ["desktop-runtime", "dep:tauri-plugin-pilot"]

[dependencies]
hiroute-client-core = { path = "../../../crates/client-core" }
hiroute-diagnostics = { path = "../../../crates/diagnostics" }
hiroute-application-api = { path = "../../../crates/application-api" }
hiroute-domain = { path = "../../../crates/domain" }
hiroute-host-runtime = { path = "../../../crates/host-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true
getrandom.workspace = true
fs2.workspace = true
reqwest = { version = "=0.13.4" }
sha2.workspace = true
tauri = { version = "2.11.1", optional = true }
tauri-plugin-dialog = { version = "2.7.3", default-features = false, features = ["xdg-portal"], optional = true }
tauri-plugin-pilot = { git = "https://github.com/mpiton/tauri-pilot", rev = "ed31926726b4cd7b3ffbc11f188e046f2b5e0faa", default-features = false, optional = true }

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.3"
nix = { workspace = true, features = ["signal", "user"] }

[target.'cfg(target_os = "macos")'.dependencies]
hiroute-desktop-host-effects = { path = "../../../crates/desktop-host-effects" }

[build-dependencies]
tauri-build = { version = "2.6", optional = true }

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "hiroute-desktop"
path = "src/main.rs"
required-features = ["desktop-runtime"]

[[example]]
name = "acl_probe"
required-features = ["desktop-runtime"]
