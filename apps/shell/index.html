<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HiRoute</title></head>
<body><div id="root" class="hr-ui occami-root"><main class="shell-status"><section class="surface"><h1 class="status-brand"><img src="../desktop/src-tauri/icons/icon.png" alt="" width="24" height="24">HiRoute</h1><h2 id="phase"></h2><p id="explanation" role="status"></p><p id="failure" role="alert"></p><div id="recovery-material" hidden><p><strong id="batch-label"></strong><code id="batch"></code></p><p><strong id="source-label"></strong><code id="source"></code></p><p id="guide-location"></p></div><div id="console-recovery" hidden><p id="recovery-explanation"></p><pre>hiroute console init --mode loopback

<button id="update" class="btn" hidden></button>
<button id="update-cancel" class="btn" hidden></button>
<button id="update-confirm" class="btn btn-primary" hidden></button>
<button id="language" class="btn"></button><button id="theme" class="btn"></button><label id="theme-choice" hidden><span id="theme-label"></span><select id="linux-theme" class="input"><option value="system"></option><option value="light"></option><option value="dark"></option></select></label></div></section></main></div><script type="module" src="./src/main.ts"></script></body></html>
