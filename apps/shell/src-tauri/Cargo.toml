[package]
name = "hiroute-shell"
version = "0.3.2-dev.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
shell-runtime = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-dialog"]

[dependencies]
hiroute-host-runtime = { path = "../../../crates/host-runtime" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
fs2.workspace = true
url = "=2.5.8"

[target.'cfg(windows)'.dependencies]
hiroute-application-api = { path = "../../../crates/application-api" }
hiroute-client-core = { path = "../../../crates/client-core" }
hiroute-platform = { path = "../../../crates/platform" }
tokio.workspace = true
reqwest = { version = "=0.13.4" }
tauri = { version = "=2.11.5", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-single-instance = { version = "=2.4.1", optional = true }
tauri-plugin-dialog = { version = "=2.7.3", default-features = false, optional = true }

[build-dependencies]
tauri-build = { version = "=2.6.3", optional = true }

[dev-dependencies]
hiroute-diagnostics = { path = "../../../crates/diagnostics" }
tempfile.workspace = true

[[bin]]
name = "hiroute-shell"
path = "src/main.rs"
required-features = ["shell-runtime"]
