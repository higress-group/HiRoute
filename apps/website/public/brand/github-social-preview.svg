<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" fill="none" role="img" aria-labelledby="title description">
  <title id="title">HiRoute repository social preview</title>
  <desc id="description">HiRoute display wordmark and a staged routing path on a deep graphite background.</desc>
  <defs>
    <linearGradient id="background" x1="82" y1="42" x2="1198" y2="598" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11141D"/>
      <stop offset=".58" stop-color="#0B0D12"/>
      <stop offset="1" stop-color="#10121A"/>
    </linearGradient>
    <linearGradient id="route" x1="427" y1="190" x2="864" y2="126" gradientUnits="userSpaceOnUse">
