durable_specs:
    mode: repository
html_review:
    enabled: false
rules:
    language: English
    language_instructions: 'Write public Issues, designs, decisions, task records, comments, PR descriptions and current specifications in English. Keep canonical issue-spec structural tokens and typed headers unchanged. Conversation with the user may follow their preferred language.'
    public_content: 'Before publishing Issue, Design, comment or attachment content, check that it is self-contained and contains no private infrastructure addresses, personal configuration, credentials, raw operational logs or confidential records. Use sanitized examples and concise observable results. Ask the user about a genuinely unresolved disclosure boundary; this does not add routine per-write approval or automatic scanning.'
    records: 'Keep design discussions, alternatives, decisions, progress, handoff and validation summaries in the corresponding GitHub Issue or PR. Commit current durable specifications and long-lived architecture, user and developer guides. Keep drafts, raw evidence and one-off investigation notes in ignored local artifacts. Delivery PR descriptions must include closing keywords for every fully delivered Issue in the selected scope, including existing Proposal, Design and Implement Issues. Keep partial or ongoing work as ordinary references, preserve closing links during PR edits, and verify GitHub recognizes them before human merge.'
guidance:
    shared: [issue-spec/project/workflow.md]
    propose: [issue-spec/project/planning.md]
    apply: [issue-spec/project/implementation.md]
    review: [issue-spec/project/review.md]
