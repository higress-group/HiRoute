[package]
name = "hiroute-integrations"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
semver.workspace = true
getrandom.workspace = true
hiroute-domain = { path = "../domain" }
hiroute-application = { path = "../application" }
hiroute-application-api = { path = "../application-api" }
hiroute-gateway = { path = "../gateway" }
hiroute-platform = { path = "../platform" }
http.workspace = true
reqwest = { version = "=0.13.4", features = ["blocking"] }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
toml_edit = "=0.25.13"
zeroize.workspace = true
tempfile.workspace = true

[features]
test-support = []

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["process", "signal"] }
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
sha2.workspace = true
unicode-normalization.workspace = true

[target.'cfg(windows)'.dev-dependencies]
base64.workspace = true
hiroute-platform-test-support = { path = "../platform/test-support" }
