[package]
name = "hiroute-platform"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
getrandom.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
url = "=2.5.8"
windows-sys = { version = "0.61.2", features = [
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Services",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
] }

windows = { version = "=0.62.2", features = [
    "Win32_Foundation", "Win32_System_Com", "Win32_System_TaskScheduler",
    "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_RemoteDesktop", "Win32_NetworkManagement_NetManagement", "Win32_System_StationsAndDesktops",
] }
