[package]
name = "hiroute-cli"
version = "0.3.2-dev.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
getrandom.workspace = true
hiroute-integrations = { path = "../integrations" }
hiroute-client-core = { path = "../client-core" }
hiroute-host-runtime = { path = "../host-runtime" }
tokio = { workspace = true, features = ["signal", "time"] }
hiroute-application-api = { path = "../application-api" }
nix = { workspace = true, features = ["signal", "user", "term"] }
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
serde_path_to_error = "0.1.20"
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
hiroute-diagnostics = { path = "../diagnostics" }
hiroute-platform = { path = "../platform" }

[dev-dependencies]
hiroute-observation = { path = "../observation", features = ["test-support"] }
hiroute-application = { path = "../application" }
hiroute-daemon = { path = "../daemon" }
hiroute-domain = { path = "../domain" }
hiroute-local-storage = { path = "../local-storage" }

[target.'cfg(windows)'.dev-dependencies]
hiroute-platform-test-support = { path = "../platform/test-support" }

[[bin]]
name = "hiroute"
path = "src/main.rs"

[[bin]]
name = "generate-cli-contract"
path = "src/bin/generate_cli_contract.rs"
