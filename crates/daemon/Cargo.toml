[package]
name = "hiroute-daemon"
version = "0.3.2-dev.1"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
integration-test-hooks = [
    "hiroute-gateway/e2e-test-control",
    "hiroute-integrations/test-support",
]

[dependencies]
fs2.workspace = true
bytes.workspace = true
hyper = { version = "=1.11.1", features = ["server", "http1"] }
hyper-util = { version = "=0.1.20", features = ["tokio"] }
http-body-util = "=0.1.5"
hiroute-product-session = { path = "../product-session" }
hiroute-client-core = { path = "../client-core" }
hiroute-platform = { path = "../platform" }
agent-client-protocol = "=2.1.0"
arc-swap.workspace = true
async-trait.workspace = true
futures.workspace = true
hiroute-application = { path = "../application" }
hiroute-application-api = { path = "../application-api" }
hiroute-cpa-bridge = { path = "../cpa-bridge" }
hiroute-diagnostics = { path = "../diagnostics" }
hiroute-domain = { path = "../domain" }
hiroute-gateway = { path = "../gateway" }
hiroute-host-runtime = { path = "../host-runtime" }
hiroute-integrations = { path = "../integrations" }
hiroute-local-storage = { path = "../local-storage" }
hiroute-observation = { path = "../observation" }
getrandom.workspace = true
http.workspace = true
rusqlite.workspace = true
same-file = "=1.0.6"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
rustix = { workspace = true, features = ["fs"] }

[[bin]]
name = "hirouted"
path = "src/control/bin.rs"

[dev-dependencies]
hiroute-observation = { path = "../observation", features = ["test-support"] }
base64.workspace = true
hiroute-integrations = { path = "../integrations", features = ["test-support"] }
fs2.workspace = true
hiroute-client-core = { path = "../client-core" }
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dev-dependencies]
command-fds = "0.3.3"

[target.'cfg(windows)'.dev-dependencies]
hiroute-platform-test-support = { path = "../platform/test-support" }
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
    "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Console",
    "Win32_System_RemoteDesktop", "Win32_NetworkManagement_NetManagement", "Win32_System_Services",
] }
