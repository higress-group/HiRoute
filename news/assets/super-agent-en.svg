<rect x=".5" y=".5" width="1199" height="719" rx="24" fill="none" stroke="#2c3150"/>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
 <text x="64" y="78" font-size="15" letter-spacing="2" fill="#8d95b8">SUPER AGENT · HERMES + HIROUTE</text>
 <text x="64" y="124" font-size="28" font-weight="700" fill="#eef0f8">Hermes talks and dispatches; execution Agents do the work</text>
 <text x="64" y="160" font-size="16" fill="#8d95b8">The Router stays responsive while Workers run in their own context, and every turn still gets a fitting model</text>
 <rect x="64" y="196" width="300" height="64" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="88" y="235" font-size="20" font-weight="700" fill="#eef0f8">You</text><text x="135" y="234" font-size="15" fill="#a3abc6">Ask in a chat app or terminal</text><rect x="212.5" y="276.0" width="3" height="18.0" rx="1.5" fill="#8d95b8" fill-opacity=".8"/><path d="M208.0 278.0L214.0 266.0L220.0 278.0z" fill="#8d95b8"/><path d="M208.0 292.0L214.0 304.0L220.0 292.0z" fill="#8d95b8"/><rect x="64" y="310" width="300" height="290" rx="16" fill="#a98bff" fill-opacity=".07" stroke="#a98bff" stroke-opacity=".38"/><text x="88" y="352" font-size="24" font-weight="700" fill="#eef0f8">Hermes</text><rect x="186" y="331" width="63" height="26" rx="13" fill="#a98bff" fill-opacity=".2"/><text x="197" y="349" font-size="13" fill="#d6c9ff">Router</text><circle cx="100" cy="399" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="404" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">1</text><text x="124" y="404" font-size="15" fill="#dfe3f3">Understand intent, pick a plan</text><circle cx="100" cy="449" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="454" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">2</text><text x="124" y="454" font-size="15" fill="#dfe3f3">Submit, return to the chat</text><circle cx="100" cy="499" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="504" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">3</text><text x="124" y="504" font-size="15" fill="#dfe3f3">Wait in a background process</text><circle cx="100" cy="549" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="554" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">4</text><text x="124" y="554" font-size="15" fill="#dfe3f3">Wake, fetch the result, reply</text><text x="462" y="388" font-size="13" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#6fe8cf" text-anchor="middle">worker exec --no-wait</text><rect x="374.0" y="400.5" width="168.0" height="3" rx="1.5" fill="url(#link)"/><path d="M540.0 396.0L552.0 402.0L540.0 408.0z" fill="#2fd6b5"/><text x="462" y="426" font-size="13" fill="#a3abc6" text-anchor="middle">returns task and run IDs</text><text x="462" y="508" font-size="13" fill="#a3abc6" text-anchor="middle">Run ends, the wait exits</text><rect x="384.0" y="520.5" width="168.0" height="3" rx="1.5" fill="url(#back)"/><path d="M386.0 516.0L374.0 522.0L386.0 528.0z" fill="#a98bff"/><text x="462" y="546" font-size="13" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#d6c9ff" text-anchor="middle">notify_on_complete</text><rect x="560" y="196" width="576" height="404" rx="16" fill="#2fd6b5" fill-opacity=".04" stroke="#2fd6b5" stroke-opacity=".3"/><text x="588" y="236" font-size="20" font-weight="700" fill="#eef0f8">HiRoute routing plans</text><rect x="807" y="217" width="63" height="26" rx="13" fill="#2fd6b5" fill-opacity=".16"/><text x="818" y="235" font-size="13" fill="#6fe8cf">Worker</text><text x="1112" y="235" font-size="14" fill="#8d95b8" text-anchor="end">One execution Agent per plan</text><rect x="584" y="258" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="289" font-size="17" font-weight="700" fill="#eef0f8">Research</text><text x="606" y="312" font-size="13" fill="#8d95b8">Read sources, collect facts</text><rect x="862.0" y="292.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 288.0L914.0 294.0L902.0 300.0z" fill="#2fd6b5"/><rect x="922" y="274" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="299" font-size="16" fill="#eef0f8" text-anchor="middle">Pi</text><rect x="584" y="342" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="373" font-size="17" font-weight="700" fill="#eef0f8">Analysis</text><text x="606" y="396" font-size="13" fill="#8d95b8">Trace causes, explain the problem</text><rect x="862.0" y="376.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 372.0L914.0 378.0L902.0 384.0z" fill="#2fd6b5"/><rect x="922" y="358" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="383" font-size="16" fill="#eef0f8" text-anchor="middle">DeepSeek Harness</text><rect x="584" y="426" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="457" font-size="17" font-weight="700" fill="#eef0f8">Coding</text><text x="606" y="480" font-size="13" fill="#8d95b8">Fix, add tests, open a PR</text><rect x="862.0" y="460.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 456.0L914.0 462.0L902.0 468.0z" fill="#2fd6b5"/><rect x="922" y="442" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="467" font-size="16" fill="#eef0f8" text-anchor="middle">Qoder CLI</text><rect x="584" y="510" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="541" font-size="17" font-weight="700" fill="#eef0f8">Code review</text><text x="606" y="564" font-size="13" fill="#8d95b8">Run tests, check compatibility</text><rect x="862.0" y="544.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 540.0L914.0 546.0L902.0 552.0z" fill="#2fd6b5"/><rect x="922" y="526" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="551" font-size="16" fill="#eef0f8" text-anchor="middle">Codex CLI</text><rect x="64" y="628" width="1072" height="52" rx="14" fill="#a98bff" fill-opacity=".08" stroke="#a98bff" stroke-opacity=".35"/><text x="600" y="659" font-size="16" fill="#d6c9ff" text-anchor="middle">Inside each plan, System One still picks the economy or primary group turn by turn</text>
</g>
