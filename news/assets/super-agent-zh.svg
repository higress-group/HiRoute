<rect x=".5" y=".5" width="1199" height="719" rx="24" fill="none" stroke="#2c3150"/>
<g font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
 <text x="64" y="78" font-size="15" letter-spacing="2" fill="#8d95b8">SUPER AGENT · HERMES + HIROUTE</text>
 <text x="64" y="124" font-size="30" font-weight="700" fill="#eef0f8">Hermes 负责对话和分派，执行 Agent 各自干活</text>
 <text x="64" y="160" font-size="16" fill="#8d95b8">Router 保持响应，Worker 在各自的上下文里执行；每个执行 Agent 用多贵的模型，再一轮一轮判断</text>
 <rect x="64" y="196" width="300" height="64" rx="14" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="88" y="235" font-size="20" font-weight="700" fill="#eef0f8">你</text><text x="122" y="234" font-size="15" fill="#a3abc6">在 IM 或终端里提需求</text><rect x="212.5" y="276.0" width="3" height="18.0" rx="1.5" fill="#8d95b8" fill-opacity=".8"/><path d="M208.0 278.0L214.0 266.0L220.0 278.0z" fill="#8d95b8"/><path d="M208.0 292.0L214.0 304.0L220.0 292.0z" fill="#8d95b8"/><rect x="64" y="310" width="300" height="290" rx="16" fill="#a98bff" fill-opacity=".07" stroke="#a98bff" stroke-opacity=".38"/><text x="88" y="352" font-size="24" font-weight="700" fill="#eef0f8">Hermes</text><rect x="186" y="331" width="63" height="26" rx="13" fill="#a98bff" fill-opacity=".2"/><text x="197" y="349" font-size="13" fill="#d6c9ff">Router</text><circle cx="100" cy="399" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="404" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">1</text><text x="124" y="404" font-size="16" fill="#dfe3f3">理解意图，按用途选计划</text><circle cx="100" cy="449" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="454" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">2</text><text x="124" y="454" font-size="16" fill="#dfe3f3">提交任务，马上回到对话</text><circle cx="100" cy="499" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="504" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">3</text><text x="124" y="504" font-size="16" fill="#dfe3f3">在后台等到任务结束</text><circle cx="100" cy="549" r="12" fill="#161829" stroke="#a98bff" stroke-opacity=".7"/><text x="100" y="554" font-size="13" font-weight="700" fill="#d6c9ff" text-anchor="middle">4</text><text x="124" y="554" font-size="16" fill="#dfe3f3">被唤起后取回结果，回复你</text><text x="462" y="388" font-size="13" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#6fe8cf" text-anchor="middle">worker exec --no-wait</text><rect x="374.0" y="400.5" width="168.0" height="3" rx="1.5" fill="url(#link)"/><path d="M540.0 396.0L552.0 402.0L540.0 408.0z" fill="#2fd6b5"/><text x="462" y="426" font-size="13" fill="#a3abc6" text-anchor="middle">提交即返回 task / run ID</text><text x="462" y="508" font-size="13" fill="#a3abc6" text-anchor="middle">任务结束，后台等待退出</text><rect x="384.0" y="520.5" width="168.0" height="3" rx="1.5" fill="url(#back)"/><path d="M386.0 516.0L374.0 522.0L386.0 528.0z" fill="#a98bff"/><text x="462" y="546" font-size="13" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Liberation Mono',monospace" fill="#d6c9ff" text-anchor="middle">notify_on_complete</text><rect x="560" y="196" width="576" height="404" rx="16" fill="#2fd6b5" fill-opacity=".04" stroke="#2fd6b5" stroke-opacity=".3"/><text x="588" y="236" font-size="20" font-weight="700" fill="#eef0f8">HiRoute 路由计划</text><rect x="761" y="217" width="63" height="26" rx="13" fill="#2fd6b5" fill-opacity=".16"/><text x="772" y="235" font-size="13" fill="#6fe8cf">Worker</text><text x="1112" y="235" font-size="14" fill="#8d95b8" text-anchor="end">每份计划绑定一个执行 Agent</text><rect x="584" y="258" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="289" font-size="17" font-weight="700" fill="#eef0f8">资料搜集</text><text x="606" y="312" font-size="13" fill="#8d95b8">读资料、查文档、整理清单</text><rect x="862.0" y="292.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 288.0L914.0 294.0L902.0 300.0z" fill="#2fd6b5"/><rect x="922" y="274" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="299" font-size="16" fill="#eef0f8" text-anchor="middle">Pi</text><rect x="584" y="342" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="373" font-size="17" font-weight="700" fill="#eef0f8">问题分析</text><text x="606" y="396" font-size="13" fill="#8d95b8">梳理来龙去脉、找出原因</text><rect x="862.0" y="376.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 372.0L914.0 378.0L902.0 384.0z" fill="#2fd6b5"/><rect x="922" y="358" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="383" font-size="16" fill="#eef0f8" text-anchor="middle">DeepSeek Harness</text><rect x="584" y="426" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="457" font-size="17" font-weight="700" fill="#eef0f8">工程编码</text><text x="606" y="480" font-size="13" fill="#8d95b8">修复、补测试、提 PR</text><rect x="862.0" y="460.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 456.0L914.0 462.0L902.0 468.0z" fill="#2fd6b5"/><rect x="922" y="442" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="467" font-size="16" fill="#eef0f8" text-anchor="middle">Qoder CLI</text><rect x="584" y="510" width="528" height="72" rx="12" fill="#ffffff" fill-opacity=".03" stroke="#2c3150"/><text x="606" y="541" font-size="17" font-weight="700" fill="#eef0f8">代码审查</text><text x="606" y="564" font-size="13" fill="#8d95b8">跑测试、核对边界和兼容性</text><rect x="862.0" y="544.5" width="42.0" height="3" rx="1.5" fill="url(#link)"/><path d="M902.0 540.0L914.0 546.0L902.0 552.0z" fill="#2fd6b5"/><rect x="922" y="526" width="174" height="40" rx="20" fill="#2fd6b5" fill-opacity=".12" stroke="#2fd6b5" stroke-opacity=".45"/><text x="1009" y="551" font-size="16" fill="#eef0f8" text-anchor="middle">Codex CLI</text><rect x="64" y="628" width="1072" height="52" rx="14" fill="#a98bff" fill-opacity=".08" stroke="#a98bff" stroke-opacity=".35"/><text x="600" y="660" font-size="17" fill="#d6c9ff" text-anchor="middle">每份计划内部还有一层模型路由：System One 每轮判断，用经济组还是主力组</text>
</g>
