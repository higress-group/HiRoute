<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Hermes 负责对话和分派，执行 Agent 各自干活. 理解意图，按用途选计划; 提交任务，马上回到对话; 在后台等到任务结束; 被唤起后取回结果，回复你. 资料搜集 → Pi; 问题分析 → DeepSeek Harness; 工程编码 → Qoder CLI; 代码审查 → Codex CLI. 每份计划内部还有一层模型路由：System One 每轮判断，用经济组还是主力组">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#161829"/><stop offset="1" stop-color="#0a0b12"/></linearGradient>
 <radialGradient id="glow" cx=".78" cy=".5" r=".55"><stop offset="0" stop-color="#7b5cff" stop-opacity=".22"/><stop offset="1" stop-color="#7b5cff" stop-opacity="0"/></radialGradient>
 <linearGradient id="link" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8d95b8" stop-opacity=".7"/><stop offset="1" stop-color="#2fd6b5"/></linearGradient>
 <linearGradient id="back" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a98bff"/><stop offset="1" stop-color="#8d95b8" stop-opacity=".7"/></linearGradient>
</defs>
<rect width="1200" height="720" rx="24" fill="url(#bg)"/>
<rect width="1200" height="720" rx="24" fill="url(#glow)"/>
