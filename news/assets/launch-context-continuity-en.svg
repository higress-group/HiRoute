<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img"><title>Context continuity and KV Cache reuse</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#AAA1BE" /></marker></defs><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="0" width="1600" height="1080" rx="0" fill="#FFFFFF" stroke="none" stroke-width="2" /><rect x="56" y="38" width="505" height="47" rx="23" fill="#F1ECFF" stroke="none" stroke-width="2" /><text x="79" y="70" font-size="25" fill="#6942D8" font-weight="600">HiRoute · Context continuity</text><text x="56" y="148" font-size="44" fill="#15203A" font-weight="700">Context continuity: smarter routing, high KV Cache hit rates</text><text x="56" y="195" font-size="28" fill="#647086" font-weight="400">Keep one model while context stays continuous; reassess when history is rebuilt.</text><rect x="56" y="241" width="469" height="429" rx="22" fill="#F8F6FE" stroke="#E2D9F8" stroke-width="2" /><text x="81" y="290" font-size="30" fill="#5834BB" font-weight="700">01  Before rebuild · Model A</text><text x="81" y="332" font-size="25" fill="#69738A" font-weight="400">Tool results extend this turn</text><rect x="82" y="374" width="165" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="91" y="409" font-size="21" fill="#FFFFFF" font-weight="500">Prior context</text><rect x="253" y="374" width="65" height="53" rx="9" fill="#E8DEFF" stroke="none" stroke-width="2" /><text x="262" y="409" font-size="21" fill="#5F40AB" font-weight="500">Input</text><rect x="82" y="453" width="165" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="91" y="488" font-size="21" fill="#FFFFFF" font-weight="500">Prior context</text><rect x="253" y="453" width="65" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="262" y="488" font-size="21" fill="#FFFFFF" font-weight="500">Input</text><rect x="324" y="453" width="80" height="53" rx="9" fill="#E8DEFF" stroke="none" stroke-width="2" /><text x="333" y="488" font-size="21" fill="#5F40AB" font-weight="500">Tool 1</text><rect x="82" y="532" width="165" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="91" y="567" font-size="21" fill="#FFFFFF" font-weight="500">Prior context</text><rect x="253" y="532" width="65" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="262" y="567" font-size="21" fill="#FFFFFF" font-weight="500">Input</text><rect x="324" y="532" width="80" height="53" rx="9" fill="#7754D7" stroke="none" stroke-width="2" /><text x="333" y="567" font-size="21" fill="#FFFFFF" font-weight="500">Tool 1</text><rect x="410" y="532" width="80" height="53" rx="9" fill="#E8DEFF" stroke="none" stroke-width="2" /><text x="419" y="567" font-size="21" fill="#5F40AB" font-weight="500">Tool 2</text><text x="82" y="626" font-size="24" fill="#5834BB" font-weight="600">Stable model, growing cache reuse</text><path d="M 535 451 L 571 451" fill="none" stroke="#AAA1BE" stroke-width="3" marker-end="url(#arrow)" /><rect x="590" y="241" width="418" height="429" rx="22" fill="#FAFBFD" stroke="#DFE4EE" stroke-width="2" /><text x="615" y="290" font-size="30" fill="#25334D" font-weight="700">02  Context rebuilt</text><text x="615" y="332" font-size="22" fill="#69738A" font-weight="400">Compacted history breaks continuity</text><rect x="615" y="369" width="367" height="58" rx="10" fill="#ECEEF4" stroke="none" stroke-width="2" /><text x="637" y="407" font-size="27" fill="#58647A" font-weight="600">Old prefix → New prefix</text><text x="615" y="472" font-size="25" fill="#37435C" font-weight="600">The full old prefix breaks</text><text x="615" y="514" font-size="25" fill="#69738A" font-weight="400">Even if model A continues</text><rect x="615" y="552" width="367" height="80" rx="14" fill="#F0EAFE" stroke="none" stroke-width="2" /><text x="636" y="585" font-size="27" fill="#6542C3" font-weight="600">Reassess which model</text><text x="636" y="619" font-size="27" fill="#6542C3" font-weight="600">should take the next stage</text><path d="M 1018 451 L 1054 451" fill="none" stroke="#AAA1BE" stroke-width="3" marker-end="url(#arrow)" /><rect x="1073" y="241" width="471" height="429" rx="22" fill="#F0FAF7" stroke="#CDE9DF" stroke-width="2" /><text x="1098" y="290" font-size="26" fill="#217D6B" font-weight="700">03  After rebuild · New prefix</text><rect x="1098" y="320" width="178" height="49" rx="22" fill="#E1F2EB" stroke="none" stroke-width="2" /><text x="1128" y="354" font-size="27" fill="#217D6B" font-weight="600">Continue A</text><text x="1291" y="354" font-size="24" fill="#7C8E87" font-weight="400">or</text><rect x="1331" y="320" width="181" height="49" rx="22" fill="#E1F2EB" stroke="none" stroke-width="2" /><text x="1361" y="354" font-size="27" fill="#217D6B" font-weight="600">Choose B</text><text x="1098" y="418" font-size="23" fill="#3C6F62" font-weight="600">Build cache hits on the new prefix</text><rect x="1098" y="454" width="255" height="53" rx="9" fill="#298F7A" stroke="none" stroke-width="2" /><text x="1118" y="489" font-size="24" fill="#FFFFFF" font-weight="500">New context</text><rect x="1098" y="530" width="255" height="53" rx="9" fill="#298F7A" stroke="none" stroke-width="2" /><text x="1118" y="565" font-size="24" fill="#FFFFFF" font-weight="500">New context</text><rect x="1360" y="530" width="153" height="53" rx="9" fill="#D5EEE6" stroke="none" stroke-width="2" /><text x="1374" y="565" font-size="24" fill="#217D6B" font-weight="500">New input</text><text x="1098" y="627" font-size="23" fill="#217D6B" font-weight="600">Keep this model; reuse its cache</text><rect x="56" y="707" width="1488" height="87" rx="18" fill="#F5F2FD" stroke="none" stroke-width="2" /><text x="86" y="763" font-size="31" fill="#5735B7" font-weight="600">Continuous prefixes keep cache hits high; rebuilt prefixes allow a new choice.</text><rect x="56" y="828" width="1488" height="125" rx="18" fill="#FAFBFD" stroke="#E5E9F0" stroke-width="2" /><text x="82" y="873" font-size="28" fill="#33425A" font-weight="600">Another decision point: a new user request</text><text x="82" y="918" font-size="23" fill="#69738A" font-weight="400">Each new user request is reassessed. Appending a message can still preserve the old prefix on the same model.</text><text x="56" y="1001" font-size="22" fill="#7B8495" font-weight="400">An unchanged common prefix may still be reused on the same model; this does not imply a total cache reset.</text><text x="56" y="1040" font-size="22" fill="#7B8495" font-weight="400">Different models do not share KV Cache. Cache hits also depend on the connected model service.</text></g></svg>
