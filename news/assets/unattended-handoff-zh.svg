<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 350" role="img"><title>一项长任务，3 次自动模型接力</title><rect width="1240" height="350" rx="20" fill="#eef2fa"/><g font-family="system-ui,sans-serif" fill="#192439"><text x="32" y="48" font-size="26" font-weight="700">一项长任务，3 次自动模型接力</text><rect x="32" y="85" width="252" height="142" rx="14" fill="white"/><text x="48" y="122" font-size="20" font-weight="700">Qwen 起步</text><text x="48" y="162" font-size="17" font-weight="400">阅读源码与测试</text><text x="48" y="198" font-size="15" font-weight="400">经济模型优先起步</text><path d="M 293 151 h 38 m -10 -7 l 10 7 -10 7" fill="none" stroke="#586caa" stroke-width="3"/><rect x="340" y="85" width="252" height="142" rx="14" fill="white"/><text x="356" y="122" font-size="20" font-weight="700">Astra 整理交接</text><text x="356" y="162" font-size="17" font-weight="400">完成上下文摘要</text><text x="356" y="198" font-size="15" font-weight="400">0.41 &lt; 0.5 · 升级</text><path d="M 601 151 h 38 m -10 -7 l 10 7 -10 7" fill="none" stroke="#586caa" stroke-width="3"/><rect x="648" y="85" width="252" height="142" rx="14" fill="white"/><text x="664" y="122" font-size="20" font-weight="700">Qwen 接续</text><text x="664" y="162" font-size="17" font-weight="400">继续研究与探查</text><text x="664" y="198" font-size="15" font-weight="400">摘要交接后按策略回切</text><path d="M 909 151 h 38 m -10 -7 l 10 7 -10 7" fill="none" stroke="#586caa" stroke-width="3"/><rect x="956" y="85" width="252" height="142" rx="14" fill="white"/><text x="972" y="122" font-size="20" font-weight="700">Astra 完成交付</text><text x="972" y="162" font-size="17" font-weight="400">实现、测试与修复</text><text x="972" y="198" font-size="15" font-weight="400">0.485 &lt; 0.5 · 升级</text><text x="32" y="277" font-size="22" font-weight="700">3 次自动切换 · 零中途人工提示 · 343 项独立验收通过</text><text x="32" y="316" font-size="16" fill="#536079">31 分 36 秒：阶段反馈触发升级，交接后按策略回切，进展不足时再次升级。</text></g></svg>
