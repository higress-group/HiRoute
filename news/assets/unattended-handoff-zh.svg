<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" role="img"><title>长任务自动模型接力</title><rect width="1100" height="320" rx="20" fill="#eef2fa"/><g font-family="system-ui,sans-serif" fill="#192439"><text x="40" y="48" font-size="26" font-weight="700">长任务自动模型接力</text><rect x="40" y="85" width="280" height="110" rx="14" fill="white"/><text x="60" y="123" font-size="20" font-weight="700">Qwen 执行</text><text x="60" y="163" font-size="16">25 次模型请求</text><path d="M 330 140 h 65 m -10 -7 l 10 7 -10 7" fill="none" stroke="#586caa" stroke-width="3"/><rect x="410" y="85" width="280" height="110" rx="14" fill="white"/><text x="430" y="123" font-size="20" font-weight="700">上下文交接 · 重新评估</text><text x="430" y="163" font-size="16">0.485 &lt; 0.5 胜任度下限</text><path d="M 700 140 h 65 m -10 -7 l 10 7 -10 7" fill="none" stroke="#586caa" stroke-width="3"/><rect x="780" y="85" width="280" height="110" rx="14" fill="white"/><text x="800" y="123" font-size="20" font-weight="700">Astra 接续</text><text x="800" y="163" font-size="16">13 次实际工具调用</text><text x="40" y="246" font-size="22" font-weight="700">31 分 36 秒 · 零中途人工提示 · 343 项独立验收通过</text><text x="40" y="287" font-size="15" fill="#536079">单个 HTTPX 任务的实际记录；此案例不主张成本节省。</text></g></svg>
