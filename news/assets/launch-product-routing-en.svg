546" font-size="21" fill="#56647D" font-weight="400" text-anchor="middle">current work</text><rect x="1100" y="383" width="190" height="184" rx="16" fill="#F1ECFF" stroke="#E0D5FC" stroke-width="2"/><rect x="1171" y="401" width="48" height="48" rx="24" fill="#7650D4" stroke="none" stroke-width="2"/><text x="1195" y="435" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">2</text><text x="1195" y="484" font-size="27" fill="#142341" font-weight="700" text-anchor="middle">Model routing</text><text x="1195" y="518" font-size="21" fill="#56647D" font-weight="400" text-anchor="middle">Chooses for</text><text x="1195" y="546" font-size="21" fill="#56647D" font-weight="400" text-anchor="middle">this stage</text><rect x="1335" y="383" width="190" height="184" rx="16" fill="#F1ECFF" stroke="#E0D5FC" stroke-width="2"/><rect x="1406" y="401" width="48" height="48" rx="24" fill="#7650D4" stroke="none" stroke-width="2"/><text x="1430" y="435" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">3</text><text x="1430" y="484" font-size="27" fill="#142341" font-weight="700" text-anchor="middle">Model &amp;</text><text x="1430" y="518" font-size="21" fill="#56647D" font-weight="400" text-anchor="middle">reasoning settings</text><path d="M 293 476 H 320" fill="none" stroke="#7650D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 528 476 H 555" fill="none" stroke="#7650D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1063 476 H 1090" fill="none" stroke="#7650D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1298 476 H 1325" fill="none" stroke="#7650D4" stroke-width="3" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="1185" y="614" font-size="26" fill="#344B72" font-weight="400" text-anchor="middle">Economy / primary models</text><text x="1185" y="652" font-size="25" fill="#344B72" font-weight="400" text-anchor="middle">or custom writing / review branche