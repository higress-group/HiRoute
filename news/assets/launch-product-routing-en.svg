<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M 0 0 L 8 4 L 0 8 Z" fill="#7650D4"/></marker></defs><g font-family="Arial,Helvetica,sans-serif"><title>Choose the agent for the task, the model for each stage</title><desc>Independent task routing and model routing, using existing subscriptions, APIs, free quotas, and local models.</desc><rect x="0" y="0" width="1600" height="960" rx="0" fill="#fff" stroke="none" stroke-width="2"/><text x="800" y="91" font-size="46" fill="#142341" font-weight="700" text-anchor="middle">Choose the agent for the task, the model for each stage</text><path d="M 415 225 V 197 Q 415 182 430 182 H 1170 Q 1185 182 1185 197 V 225" fill="none" stroke="#7650D4" stroke-width="3" stroke-linejoin="round"/><rect x="575" y="145" width="450" height="72" rx="24" fill="#7650D4" stroke="none" stroke-width="2"/><text x="800" y="192" font-size="35" fill="#fff" font-weight="700" text-anchor="middle">HiRoute routing plans</text><rect x="50" y="252" width="730" height="431" rx="22" fill="#FBFAFE" stroke="#DAD0F7" stroke-width="2"/><text x="415" y="323" font-size="38" fill="#142341" font-weight="700" text-anchor="middle">Who does the work?</text><rect x="820" y="252" width="730" height="431" rx="22" fill="#FBFAFE" stroke="#DAD0F7" stroke-width="2"/><text x="1185" y="323" font-size="38" fill="#142341" font-weight="700" text-anchor="middle">What does this stage need?</text><rect x="95" y="383" width="190" height="184" rx="16" fill="#F1ECFF" stroke="#E0D5FC" stroke-width="2"/><rect x="166" y="401" width="48" height="48" rx="24" fill="#7650D4" stroke="none" stroke-width="2"/><text x="190" y="435" font-size="29" fill="#fff" font-weight="700" text-anchor="middle">1</text><text x="190" y="484" font-size="27" fill="#142341" font-weight="700" text-anchor="middle">Main agent</text><text x="190" y="518" font-